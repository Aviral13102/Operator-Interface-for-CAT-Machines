# Nginx reverse proxy template for the merged CAT Spotter operator interface.
# Copy to /etc/nginx/sites-available/cat-spotter on the EC2 box, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.

server {
    listen 80;
    server_name _;

    # React production build (from `npm run build`)
    root /var/www/cat-spotter/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
